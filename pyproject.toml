[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "movris-vault"
version = "0.1.0"
description = "Encrypted iPhone Backups for Linux"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    # Usamos detalles internos del servicio de copia (ver core/backup.py): subir de versión a mano
    "pymobiledevice3>=11.44,<12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
movris-vault = "movris_vault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
